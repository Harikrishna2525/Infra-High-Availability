name : "HA Deployment using Terraform through Github Actions into AWS"

on:
  push:
    branches:
      - main
      - master

jobs:
  terraform-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.14.9

      - name: Configure AWS creditanls using OIDC 
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::920411896934:role/Github-terraform-access
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      - name : Terraform Validate
        run: terraform validate

      - name: Terraform Apply
        run: terraform apply -auto-approve